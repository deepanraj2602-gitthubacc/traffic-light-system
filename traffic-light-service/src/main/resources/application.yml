app:
  service:
    name: '@project.artifactId@'
  server:
    host: 127.0.0.1
    port: 8989
  database:
    host: 127.0.0.1
    port: 3306
  scheduler:
    bgThreadPeriod: 30000
    lightInterim: 5
    threadPoolCount: 5
    task:
      initialDelay: 3
      period: 20

server:
  port: ${app.server.port}
  servlet:
    context-path: /api

spring:
  application:
    name: ${app.service.name}
  config:
    import: optional:configserver:http://localhost:8888/
  datasource:
    name: ${app.service.name}
    schema-name: ${app.service.name}
    parameters: allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    url: jdbc:mysql://${app.database.host}:${app.database.port}/${spring.datasource.name}?currentSchema=${spring.datasource.schema-name}&${spring.datasource.parameters}
    username: admin
    password: admin
  flyway:
    enabled: true
    baseline-version: 0
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: ${app.service.name}
    table: flyway_script_history
    encoding: UTF-8
    connectRetries: 3
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: true
    show-sql: true
    properties:
      hibernate.ddl-auto: none
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
      hibernate.id.new_generator_mappings: false
      hibernate.connection.autocommit: false
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.temp.use_jdbc_metadata_defaults: false
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        show_sql: true
        query:
          substitutions: true
  jackson:
    defaultPropertyInclusion: non_empty

springdoc:
  api-docs:
    path: /api-docs
    version: OPENAPI_3_1
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: debug
    org:
      flywaydb: debug
